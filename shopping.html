<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Shopping — Em construção · Enjoy Pineapple</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A vitrine de ofertas da Enjoy Pineapple está em construção.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@700;800&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--text:#000000;--text2:#3a3c40;--text3:#7a7c78;
  --accent:#C9A227;--border:rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}

nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:1.5rem 3rem;border-bottom:1px solid var(--border);
}
.nav-logo{display:flex;align-items:center;text-decoration:none;font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;letter-spacing:.1em;color:var(--text)}
.nav-logo em{color:var(--accent);font-style:normal}
.logo-anim .logo-l,.logo-anim .logo-o{display:inline-block;opacity:0;transform:translateY(-14px)}
.logo-anim .logo-sub{display:inline-block;opacity:0;transform:translateX(6px);margin-left:.4em}
.logo-anim .logo-l{animation:logoLetterIn .55s cubic-bezier(.22,1,.36,1) forwards}
.logo-anim .l1{animation-delay:.1s}
.logo-anim .l2{animation-delay:.2s}
.logo-anim .l3{animation-delay:.3s}
.logo-anim .l4{animation-delay:.55s}
.logo-anim .logo-o{animation:logoOIn .5s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:.4s;transform-origin:center}
.logo-anim .logo-sub{animation:logoSubIn .5s ease forwards;animation-delay:.7s}
@keyframes logoLetterIn{0%{opacity:0;transform:translateY(-14px)}100%{opacity:1;transform:translateY(0)}}
@keyframes logoOIn{0%{opacity:0;transform:scale(.3) rotate(-25deg)}70%{opacity:1;transform:scale(1.15) rotate(4deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes logoSubIn{0%{opacity:0;transform:translateX(6px)}100%{opacity:1;transform:translateX(0)}}
.nav-back{display:inline-flex;align-items:center;gap:.4rem;font-family:'DM Mono',monospace;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--text2)}
.nav-back:hover{color:var(--accent)}
.nav-back svg{width:14px;height:14px}

main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:5rem 1.5rem}
.stub-wrap{max-width:520px}
.stub-badge{
  display:inline-flex;align-items:center;gap:.5rem;
  border:1px solid var(--border);border-radius:100px;padding:.4rem 1rem;
  font-family:'DM Mono',monospace;font-size:.68rem;color:var(--accent);
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:2rem;
}
.stub-dot{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.stub-title{font-family:'Bebas Neue',sans-serif;font-size:4rem;line-height:1;margin:0 0 1.25rem}
.stub-title em{color:var(--accent);font-style:normal}
.stub-desc{font-size:1.05rem;color:var(--text2);line-height:1.75;margin-bottom:2.5rem;font-weight:400}
footer{background:#000;padding:15px 3rem}
.df-footer{width:100%;max-width:1300px;margin:0;text-align:left;align-self:flex-start}
.df-footer-top{display:flex;align-items:center;justify-content:space-between;gap:2rem;flex-wrap:wrap}
.df-footer-brand{display:flex;align-items:center;gap:.9rem}
.df-footer-mark{height:64px;width:auto;mix-blend-mode:screen}
.df-footer-brand-text{display:flex;flex-direction:column;gap:.6rem}
.df-footer-cnpj{font-family:'DM Mono',monospace;font-size:.68rem;color:rgba(255,255,255,.45)}
.df-footer-links{display:flex;flex-wrap:wrap;align-items:center;gap:1.75rem}
.df-footer-links a{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.75);text-decoration:none;transition:color .2s}
.df-footer-links a:hover{color:#C9A227}
.df-footer-social{display:flex;align-items:center;gap:.9rem}
.df-footer-social-link{display:flex;color:rgba(255,255,255,.75);transition:color .2s}
.df-footer-social-link:hover{color:#C9A227}
.df-footer-social-link svg{width:18px;height:18px}

@media (max-width:720px){
  nav{padding:1.25rem 1.5rem}
  .logo-anim .logo-sub{display:none}
  .stub-title{font-size:2.6rem}
}

</style>
</head>
<body>

<nav>
  <a href="#" class="nav-logo logo-anim">
    <span class="logo-l l1">E</span><span class="logo-l l2">N</span><span class="logo-l l3">J</span><em class="logo-o">O</em><span class="logo-l l4">Y</span>
    <span class="logo-sub">PINEAPPLE</span>
  </a>
  <a href="index.html" class="nav-back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    Voltar
  </a>
</nav>

<main>
  <div class="stub-wrap">
    <div class="stub-badge">
      <span class="stub-dot"></span>
      Em construção
    </div>
    <h1 class="stub-title">Shopping</h1>
    <p class="stub-desc">Estamos preparando uma vitrine de ofertas selecionadas. Volte em breve pra conferir.</p>
  </div>
</main>

<footer>
  <div class="df-footer">
    <div class="df-footer-top">
      <div class="df-footer-brand">
        <img src="ep-symbol.png" alt="Enjoy Pineapple" class="df-footer-mark">
        <div class="df-footer-brand-text">
          <div class="df-footer-cnpj">CNPJ 23.904.939/0001-86 · Porto Alegre/RS<br>© <span class="cyear"></span> Enjoy Pineapple. Todos os direitos reservados.</div>
          <span class="df-footer-social">
            <a href="https://www.youtube.com" class="df-footer-social-link" aria-label="YouTube" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="12" rx="4"/><path d="M10.5 9.5l4 2.5-4 2.5v-5z" fill="currentColor" stroke="none"/></svg>
            </a>
            <a href="https://www.instagram.com" class="df-footer-social-link" aria-label="Instagram" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".9" fill="currentColor" stroke="none"/></svg>
            </a>
            <a href="https://www.x.com" class="df-footer-social-link" aria-label="X" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M17.5 3h3.2l-7 8 8.2 10h-6.4l-5-6.5-5.7 6.5H1.6l7.5-8.6L1.2 3h6.6l4.5 6 5.2-6z"/></svg>
            </a>
          </span>
        </div>
      </div>
      <div class="df-footer-links">
        <a href="index.html#tese">Sobre nós</a>
        <a href="parceiros.html">Seja parceiro</a>
        <a href="privacidade.html">Privacidade</a>
        <a href="termos.html">Termos de Uso</a>
        <a href="suporte.html">Suporte</a>
        <a href="contato.html">Contato</a>
        <a href="shopping.html">Shopping</a>
      </div>
    </div>
  </div>
</footer>

<script>
document.querySelectorAll('.cyear').forEach(function(el){
  el.textContent = new Date().getFullYear();
});
</script>

</body>
</html>
